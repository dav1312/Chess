<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="Search and browse public chess games from any Lichess.org user with advanced filtering options for variants, ratings, and opponents.">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/webp" href="https://lichess1.org/assets/______4/flair/img/activity.lichess.webp" sizes="100x100">
    <title>Lichess Game Search</title>
    <link rel="stylesheet" href="../Utils/Bootstrap/css/bootstrap.min.css">
    <script src="../Utils/Bootstrap/js/bootstrap.bundle.min.js" defer></script>
    <script src="script.js" defer></script>
    <style>
        :root {
            --bs-success-rgb: 38, 207, 129;
        }
        body {
            padding: 20px;
        }
        p {
            margin-bottom: .5rem;
        }
        .card-body > p:last-child {
            margin-bottom: 0;
        }
        .text-bg-title {
            background-color: hsl(37, 74%, 43%);
            color: #fff;
        }
        .text-bg-bot {
            background-color: hsl(294, 62%, 48%);
            color: #fff;
        }
        body:has(#onlySearched:checked) .notSearchedUser {
            display: none;
        }
        body:has(#onlyRated:checked) .casual {
            display: none;
        }
        .dropdown-menu {
            --bs-dropdown-zindex: 1021;
        }

        /* Patron Icon Mask */
        .patron-icon {
            --wing: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" xmlns:svg="http://www.w3.org/2000/svg" viewBox="0 0 183 186" version="1.1"><g><path d="M180.64 171.09c.78-3.65 1.02-5.48 1.43-10.61.49-6.18.28-12.75-.64-20.01-3.07-24.1-15.72-44.25-37.29-59.37-11.06-7.75-21.59-12.91-44.24-21.68-40.47-15.67-55.3-22.92-73.42-35.95-8.03-5.77-13.64-10.63-20.28-17.57-2.97-3.11-5.52-5.65-5.66-5.65-.5 0-.24 12.45.36 17.14 2.6 20.35 10.66 35.18 21.51 48.3 8.09 9.78 21.8 19.04 43.76 28.56 7.68 3.33 16.14 6.62 36.12 12.06 20.01 5.44 24.09 6.94 34.53 12.64 14.01 7.66 24.69 17.97 33.61 32.47 2.95 4.79 6.73 12.55 8.46 17.37 1.13 3.15 1.48 3.61 1.76 2.3zM108.28 184.59c4.45-.78 7-1.49 15.43-4.28 7.99-2.65 13.86-4.2 18.6-4.92 4.02-.61 11.38-.29 15.53.68 3.79.88 10.01 3.54 13.4 5.72 1.45.93 2.69 1.64 2.75 1.57.24-.26-3.14-8.67-4.89-12.15-4.65-9.24-8.46-14.9-14.63-21.73-6.96-7.71-13.04-12.45-22.43-17.49-11.11-5.96-18.02-8.11-44.65-13.89-36.78-7.99-51.19-13.81-70.13-28.31-.78-.6-.8-.57-.53.85 1.39 7.27 6.36 19.56 11.52 28.5 8.44 14.62 19.68 22.69 31.69 26.21 8.02 2.35 25.92 5.12 32.65 5.47l28.68 2.58-3.88 2.57c-2.64 1.74-10.71 4.82-15.59 5.74-15.48 2.92-21.81.4-33.03-.15l-5.9-.29 1.32 2.07c1.89 2.96 7.96 9.58 11.24 12.27 4.99 4.09 11.28 7.26 17.05 8.6 4.01.93 11.62 1.12 15.77.39z" /></g></svg>');
            display: inline-block;
            margin-right: 4px;
            height: 17px;
            width: 17px;
            background-color: currentColor;
            mask-image: var(--wing);
            mask-size: contain;
            mask-repeat: no-repeat;
            mask-position: center;
            -webkit-mask-image: var(--wing);
            -webkit-mask-size: contain;
            -webkit-mask-repeat: no-repeat;
            -webkit-mask-position: center;
        }

        .autocomplete-container {
            position: relative;
            flex: 1 1 auto;
            min-width: 150px;
            width: 100%;
        }

        .autocomplete-list {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            z-index: 1050;
            display: none;
            max-height: 300px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <main class="container-xxl">
        <h1 class="mb-4">Lichess Game Search</h1>
        <form id="search-form" class="mb-4">
            <!-- Row 1: Primary Search Criteria -->
            <div class="row g-2 align-items-end mb-3">
                <div class="col-md-3 col-sm-6">
                    <label for="username" class="form-label mb-1 fw-semibold small text-secondary">Username</label>
                    <div class="autocomplete-container">
                        <input type="text" class="form-control" id="username" required autocomplete="off" placeholder="e.g. thibault">
                        <div id="username-ac" class="autocomplete-list list-group shadow"></div>
                    </div>
                </div>
                <div class="col-md-3 col-sm-6">
                    <label for="versus" class="form-label mb-1 fw-semibold small text-secondary">vs Opponent (optional)</label>
                    <div class="autocomplete-container">
                        <input type="text" class="form-control" id="versus" autocomplete="off" placeholder="e.g. lancey">
                        <div id="versus-ac" class="autocomplete-list list-group shadow"></div>
                    </div>
                </div>
                <div class="col-md-2 col-sm-4">
                    <label for="until" class="form-label mb-1 fw-semibold small text-secondary">Until Date</label>
                    <input type="date" class="form-control" id="until" name="until">
                </div>
                <div class="col-md-2 col-sm-4">
                    <label class="form-label mb-1 fw-semibold small text-secondary d-block">Variant</label>
                    <div class="dropdown">
                        <button class="btn btn-outline-secondary w-100 dropdown-toggle" type="button" id="dropdownPerfType" data-bs-toggle="dropdown" data-bs-auto-close="outside" aria-expanded="false">
                            Select Variants
                        </button>
                        <ul class="dropdown-menu w-100" aria-labelledby="dropdownPerfType" style="max-height: 280px; overflow-y: auto;">
                            <li><label class="dropdown-item"><input type="checkbox" name="perfType" value="ultraBullet" class="form-check-input me-1"> UltraBullet</label></li>
                            <li><label class="dropdown-item"><input type="checkbox" name="perfType" value="bullet" class="form-check-input me-1"> Bullet</label></li>
                            <li><label class="dropdown-item"><input type="checkbox" name="perfType" value="blitz" class="form-check-input me-1"> Blitz</label></li>
                            <li><label class="dropdown-item"><input type="checkbox" name="perfType" value="rapid" class="form-check-input me-1"> Rapid</label></li>
                            <li><label class="dropdown-item"><input type="checkbox" name="perfType" value="classical" class="form-check-input me-1"> Classical</label></li>
                            <li><label class="dropdown-item"><input type="checkbox" name="perfType" value="correspondence" class="form-check-input me-1"> Correspondence</label></li>
                            <li><label class="dropdown-item"><input type="checkbox" name="perfType" value="chess960" class="form-check-input me-1"> Chess960</label></li>
                            <li><label class="dropdown-item"><input type="checkbox" name="perfType" value="crazyhouse" class="form-check-input me-1"> Crazyhouse</label></li>
                            <li><label class="dropdown-item"><input type="checkbox" name="perfType" value="antichess" class="form-check-input me-1"> Antichess</label></li>
                            <li><label class="dropdown-item"><input type="checkbox" name="perfType" value="atomic" class="form-check-input me-1"> Atomic</label></li>
                            <li><label class="dropdown-item"><input type="checkbox" name="perfType" value="horde" class="form-check-input me-1"> Horde</label></li>
                            <li><label class="dropdown-item"><input type="checkbox" name="perfType" value="kingOfTheHill" class="form-check-input me-1"> King of the Hill</label></li>
                            <li><label class="dropdown-item"><input type="checkbox" name="perfType" value="racingKings" class="form-check-input me-1"> Racing Kings</label></li>
                            <li><label class="dropdown-item"><input type="checkbox" name="perfType" value="threeCheck" class="form-check-input me-1"> Three-check</label></li>
                        </ul>
                    </div>
                </div>
                <div class="col-md-2 col-sm-4 d-flex gap-2">
                    <div class="w-50">
                        <input type="checkbox" class="btn-check" id="oldFirst" autocomplete="off">
                        <label class="btn btn-outline-secondary w-100 text-nowrap" for="oldFirst" title="Sort ascending date">Asc date</label>
                    </div>
                    <button type="submit" class="btn btn-primary w-50 text-nowrap">Search</button>
                </div>
            </div>

            <!-- Row 2: Secondary Redesigned Filters, Status Toggles & Check Opponents Card -->
            <div class="card border-secondary bg-dark text-light">
                <div class="card-body p-3">
                    <div class="row g-3 align-items-center">
                        <div class="col-lg-3 col-md-4 col-sm-12">
                            <button type="button" id="check-opponents" class="btn btn-info w-100 text-nowrap">Check Opponents</button>
                        </div>
                        <div class="col-lg-3 col-md-4 col-sm-12 d-flex gap-2">
                            <input type="checkbox" class="btn-check" id="onlySearched" autocomplete="off" checked>
                            <label class="btn btn-outline-secondary w-50 text-nowrap" for="onlySearched" title="Show only searched user info details in result cell">Searched</label>

                            <input type="checkbox" class="btn-check" id="onlyRated" autocomplete="off" checked>
                            <label class="btn btn-outline-secondary w-50 text-nowrap" for="onlyRated">Rated</label>
                        </div>
                        <div class="col-lg-6 col-md-4 col-sm-12 d-flex gap-2 justify-content-md-end flex-wrap">
                            <!-- Filter Won/Lost -->
                            <div class="dropdown">
                                <button class="btn btn-outline-info dropdown-toggle text-nowrap" type="button" id="dropdownOutcomeFilter" data-bs-toggle="dropdown" aria-expanded="false">
                                    Outcome: All
                                </button>
                                <ul class="dropdown-menu dropdown-menu-end" id="outcome-filter-menu" aria-labelledby="dropdownOutcomeFilter">
                                    <li><button class="dropdown-item active" type="button" data-val="all">All Outcomes</button></li>
                                    <li><button class="dropdown-item" type="button" data-val="win">Won Games</button></li>
                                    <li><button class="dropdown-item" type="button" data-val="loss">Lost Games</button></li>
                                    <li><button class="dropdown-item" type="button" data-val="draw">Drawn Games</button></li>
                                </ul>
                            </div>

                            <!-- Filter Rating Diff -->
                            <div class="dropdown">
                                <button class="btn btn-outline-info dropdown-toggle text-nowrap" type="button" id="dropdownRatingDiffFilter" data-bs-toggle="dropdown" data-bs-auto-close="outside" aria-expanded="false">
                                    Rating Diff: All
                                </button>
                                <div class="dropdown-menu dropdown-menu-end p-3" style="min-width: 250px;" aria-labelledby="dropdownRatingDiffFilter">
                                    <div class="mb-2">
                                        <label class="form-label small fw-bold">Predefined Options</label>
                                        <div class="d-flex flex-column gap-1">
                                            <button class="btn btn-sm btn-outline-secondary text-start filter-rdiff-pre active" type="button" data-min="" data-max="">All Difference</button>
                                            <button class="btn btn-sm btn-outline-secondary text-start filter-rdiff-pre" type="button" data-min="1" data-max="">Opponent Lower (Diff &gt; 0)</button>
                                            <button class="btn btn-sm btn-outline-secondary text-start filter-rdiff-pre" type="button" data-min="" data-max="-1">Opponent Higher (Diff &lt; 0)</button>
                                            <button class="btn btn-sm btn-outline-secondary text-start filter-rdiff-pre" type="button" data-min="100" data-max="">Diff &ge; +100</button>
                                            <button class="btn btn-sm btn-outline-secondary text-start filter-rdiff-pre" type="button" data-min="" data-max="-100">Diff &le; -100</button>
                                        </div>
                                    </div>
                                    <div class="dropdown-divider"></div>
                                    <div class="mb-2">
                                        <label class="form-label small fw-bold">Custom Range</label>
                                        <div class="row g-2">
                                            <div class="col-6">
                                                <input type="number" class="form-control form-control-sm" id="rdiff-min" placeholder="Min (e.g. -100)">
                                            </div>
                                            <div class="col-6">
                                                <input type="number" class="form-control form-control-sm" id="rdiff-max" placeholder="Max (e.g. 100)">
                                            </div>
                                        </div>
                                    </div>
                                    <div class="d-flex gap-2">
                                        <button type="button" class="btn btn-sm btn-primary flex-grow-1" id="btn-apply-rdiff">Apply</button>
                                        <button type="button" class="btn btn-sm btn-secondary" id="btn-clear-rdiff">Clear</button>
                                    </div>
                                </div>
                            </div>

                            <!-- Filter Moves -->
                            <div class="dropdown">
                                <button class="btn btn-outline-info dropdown-toggle text-nowrap" type="button" id="dropdownMovesFilter" data-bs-toggle="dropdown" data-bs-auto-close="outside" aria-expanded="false">
                                    Moves: All
                                </button>
                                <div class="dropdown-menu dropdown-menu-end p-3" style="min-width: 250px;" aria-labelledby="dropdownMovesFilter">
                                    <div class="mb-2">
                                        <label class="form-label small fw-bold">Predefined Options</label>
                                        <div class="d-flex flex-column gap-1">
                                            <button class="btn btn-sm btn-outline-secondary text-start filter-moves-pre active" type="button" data-min="" data-max="">All Move Counts</button>
                                            <button class="btn btn-sm btn-outline-secondary text-start filter-moves-pre" type="button" data-min="" data-max="15">Short (&le; 15 moves)</button>
                                            <button class="btn btn-sm btn-outline-secondary text-start filter-moves-pre" type="button" data-min="16" data-max="40">Medium (16-40 moves)</button>
                                            <button class="btn btn-sm btn-outline-secondary text-start filter-moves-pre" type="button" data-min="41" data-max="">Long (&ge; 41 moves)</button>
                                        </div>
                                    </div>
                                    <div class="dropdown-divider"></div>
                                    <div class="mb-2">
                                        <label class="form-label small fw-bold">Custom Range</label>
                                        <div class="row g-2">
                                            <div class="col-6">
                                                <input type="number" class="form-control form-control-sm" id="moves-min" min="1" placeholder="Min">
                                            </div>
                                            <div class="col-6">
                                                <input type="number" class="form-control form-control-sm" id="moves-max" min="1" placeholder="Max">
                                            </div>
                                        </div>
                                    </div>
                                    <div class="d-flex gap-2">
                                        <button type="button" class="btn btn-sm btn-primary flex-grow-1" id="btn-apply-moves">Apply</button>
                                        <button type="button" class="btn btn-sm btn-secondary" id="btn-clear-moves">Clear</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </form>
        <div id="playerData" class="row g-3 mb-3"></div>
        <div class="table-responsive" >
            <table id="results" class="table table-hover align-middle"></table>
        </div>
        <div id="loading-sentinel" style="height: 20px;"></div>
    </main>
</body>
</html>
